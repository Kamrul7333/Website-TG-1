function makeTitle(url){
  let name=url.split("/").pop().replace(".html","").replace(/[-_]+/g," ");
  return name.replace(/\b\w/g,c=>c.toUpperCase());
}

function renderVideos(list){
  const grid=document.getElementById("videoGrid");
  const noResult=document.getElementById("noResult");
  grid.innerHTML="";
  if(!list.length){noResult.style.display="block";return;}
  noResult.style.display="none";

  list.forEach(url=>{
    const originalIndex=videos.indexOf(url);
    const title=makeTitle(url);
    const thumb=thumbnails[originalIndex] || "";

    const card=document.createElement("div");
    card.className="video-card";
    card.innerHTML=`
      <div class="thumb">
        <img src="${thumb}" alt="${title}" loading="lazy"
             onerror="this.style.display='none'">
        <span class="badge">VIDEO</span>
        <div class="play">▶</div>
      </div>
      <div class="card-content">
        <div class="card-number">Video #${originalIndex+1}</div>
        <div class="card-title">${title}</div>
        <a class="watch-btn" href="${url}" target="_blank" rel="noopener noreferrer">▶ Watch Video</a>
      </div>`;
    grid.appendChild(card);
  });
}

function searchVideos(){
  const keyword=document.getElementById("searchBox").value.toLowerCase().trim();
  renderVideos(videos.filter(url=>makeTitle(url).toLowerCase().includes(keyword)));
}

renderVideos(videos);
</script>
